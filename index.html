<style>
:root{color-scheme:dark;--ash:#05070a;--slab:#0e1217;--ink:#dfe4ea;--muted:#8792a0;--rule:#232b35;--ph:#55e6a5;--phd:#1f5a45;--phi:#02140d;--bad:#e04652;
  --term:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ash);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.gate{width:100%;max-width:360px;padding:28px 24px 24px;background:var(--slab);border:1px solid var(--phd);
  background-image:linear-gradient(var(--ph),var(--ph)),linear-gradient(var(--ph),var(--ph)),linear-gradient(var(--ph),var(--ph)),linear-gradient(var(--ph),var(--ph)),linear-gradient(var(--ph),var(--ph)),linear-gradient(var(--ph),var(--ph)),linear-gradient(var(--ph),var(--ph)),linear-gradient(var(--ph),var(--ph));
  background-repeat:no-repeat;background-size:14px 2px,2px 14px,14px 2px,2px 14px,14px 2px,2px 14px,14px 2px,2px 14px;
  background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%;box-shadow:0 0 30px rgba(85,230,165,.08)}
.mark{display:block;width:56px;height:56px;margin:0 auto 14px;color:var(--ph);filter:drop-shadow(0 0 6px rgba(85,230,165,.5))}
.eyebrow{font-family:var(--term);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
h1{margin:4px 0 20px;font-family:var(--term);font-size:26px;letter-spacing:.16em;text-align:center;color:var(--ph);text-shadow:0 0 10px rgba(85,230,165,.45)}
label{display:block;font-family:var(--term);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input{width:100%;padding:12px 14px;background:var(--ash);border:1px solid var(--rule);color:var(--ph);border-radius:3px;
  font-family:var(--term);font-size:24px;letter-spacing:.5em;text-align:center;caret-color:var(--ph)}
input:focus{outline:none;border-color:var(--ph);box-shadow:0 0 0 1px var(--ph),0 0 14px rgba(85,230,165,.25)}
input[aria-invalid="true"]{border-color:var(--bad)}
button{width:100%;margin-top:14px;padding:12px;border:1px solid var(--ph);background:var(--ph);color:var(--phi);border-radius:3px;
  font-family:var(--term);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.msg{min-height:1.5em;margin:12px 0 0;font-family:var(--term);font-size:12px;letter-spacing:.06em;text-align:center;color:var(--muted)}
.msg.bad{color:var(--bad)}
.remember{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;font-family:inherit}
.remember input{width:18px;height:18px;padding:0;accent-color:var(--ph)}
.gate.shake{animation:shake .32s}
:root[data-accent="cyan"]{--ph:#4fd8ff;--phd:#1b5266;--phi:#021219}
:root[data-accent="blue"]{--ph:#7a96ff;--phd:#2b3a7d;--phi:#050a20}
:root[data-accent="violet"]{--ph:#b685ff;--phd:#4b307c;--phi:#10051f}
:root[data-accent="magenta"]{--ph:#ff63d4;--phd:#6e2458;--phi:#1d0216}
:root[data-accent="orange"]{--ph:#ff8f3f;--phd:#6e3a17;--phi:#1c0b01}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.gate.shake{animation:none}}
</style>

const KEY="dominatus-access";
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const zipped=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.d));     // throws on a wrong code
  const html=await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}

const busy=b=>{go.disabled=b;go.textContent=b?"Decrypting…":"Unlock"};
f.addEventListener("submit",async e=>{e.preventDefault();const code=inp.value.trim();

    f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");inp.focus()}
});
inp.addEventListener("input",()=>inp.removeAttribute("aria-invalid"));
(async()=>{let saved=null;try{saved=localStorage.getItem(KEY)}catch(_){}
  if(saved){busy(true);try{await unlock(saved);return}catch(_){try{localStorage.removeItem(KEY)}catch(__){}busy(false)}}
  inp.focus()})();
</script>
